services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: pegasus-db
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    env_file:
      - .env
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./pegasus/sql:/sql
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s

volumes:
  oracle-data:
    name: pegasus-oracle-data
